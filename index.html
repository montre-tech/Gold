<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footprint Chart (Binance)</title>
<style>
:root{--bg:#10141a;--fg:#d8dee9;--pn:#1a2029}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
#bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px;background:var(--pn);align-items:end}
label{display:flex;flex-direction:column;font-size:11px;gap:2px;color:#8a95a5}
input,select,button{background:#0d1117;color:var(--fg);border:1px solid #333c4a;border-radius:4px;padding:5px;width:92px;font-size:13px}
button{width:auto;background:#2563eb;border:0;padding:6px 14px;cursor:pointer}
#st{margin-left:auto;font-size:12px;color:#8a95a5;align-self:center}
#wrap{flex:1;overflow:auto}
canvas{display:block}
</style>
</head>
<body>
<div id="bar">
 <label>Market<select id="mk"><option value="fut">Futures</option><option value="spot">Spot</option></select></label>
 <label>Symbol<select id="sy" style="width:170px">
  <option value="XAUUSDT|fut|0.5">Gold (XAUUSDT perp)</option>
  <option value="PAXGUSDT|spot|0.5">Gold token (PAXGUSDT spot)</option>
  <option value="XAGUSDT|fut|0.05">Silver (XAGUSDT perp)</option>
  <option value="BTCUSDT|spot|10">Bitcoin (BTCUSDT)</option>
  <option value="ETHUSDT|spot|0.5">Ethereum (ETHUSDT)</option>
  <option value="SOLUSDT|spot|0.05">Solana (SOLUSDT)</option>
  <option value="custom">Custom…</option>
 </select></label>
 <label id="cl" style="display:none">Custom<input id="cs" value="BTCUSDT"></label>
 <label>Timeframe<select id="tf"><option value="60">1m</option><option value="300" selected>5m</option><option value="900">15m</option><option value="3600">1h</option></select></label>
 <label>Row size ($)<input id="rs" type="number" value="10" step="any" min="0"></label>
 <label>Bars<input id="nb" type="number" value="8" min="2" max="40"></label>
 <label>Imb ratio<input id="ir" type="number" value="3" step="0.5" min="1.5"></label>
 <label>Min vol<input id="mv" type="number" value="0.5" step="any" min="0"></label>
 <label>Stack ≥<input id="sc" type="number" value="3" min="2"></label>
 <button id="go">Load</button>
 <span id="st">idle</span>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
const $=id=>document.getElementById(id);
let bars=new Map(),ws=null,lastId=0,gen=0,P={},dirty=false;
const BW=120,CH=16,PAD=60,FOOT=44;

function mix(a,b,t){t=Math.max(0,Math.min(1,t));return`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(",")})`}
const NEU=[38,44,54],BUY=[22,163,74],SEL=[220,38,38];

function addTrade(T,p,q,m){
  const ts=Math.floor(T/1000/P.tf)*P.tf;
  let b=bars.get(ts);if(!b){b={t:ts,lv:new Map()};bars.set(ts,b)}
  const r=Math.floor(p/P.rs+1e-9);
  let l=b.lv.get(r);if(!l){l=[0,0];b.lv.set(r,l)}
  l[m?0:1]+=q;           // m=true -> buyer is maker -> seller aggressor -> hits BID
  dirty=true;
}

async function load(){
  const g=++gen;if(ws){ws.onclose=null;ws.close()}
  const sv=$("sy").value;
  P={mk:$("mk").value,sy:sv==="custom"?$("cs").value.trim().toUpperCase():sv.split("|")[0],tf:+$("tf").value,rs:+$("rs").value||1,
     nb:+$("nb").value,ir:+$("ir").value,mv:+$("mv").value,sc:+$("sc").value};
  bars=new Map();lastId=0;
  const rest=P.mk==="spot"?"https://api.binance.com/api/v3/aggTrades":"https://fapi.binance.com/fapi/v1/aggTrades";
  let start=(Math.floor(Date.now()/1000/P.tf)-(P.nb-1))*P.tf*1000,from=null,n=0;
  try{
    while(g===gen&&n<60){
      const u=`${rest}?symbol=${P.sy}&limit=1000&`+(from===null?`startTime=${start}`:`fromId=${from}`);
      $("st").textContent=`loading history… ${++n}`;
      const r=await fetch(u);if(!r.ok)throw new Error(r.status+" "+await r.text());
      const d=await r.json();if(!d.length)break;
      for(const x of d){addTrade(x.T,+x.p,+x.q,x.m);lastId=x.a}
      from=lastId+1;if(d.length<1000||d[d.length-1].T>Date.now()-1500)break;
      draw();await new Promise(r=>setTimeout(r,60));
    }
  }catch(e){$("st").textContent="error: "+e.message+" (Binance may be blocked in your region)";return}
  if(g!==gen)return;
  // Futures: Binance retired the legacy /ws URL on 2026-04-23; aggTrade now lives on /market
  const url=(P.mk==="spot"?"wss://stream.binance.com:9443/stream?streams=":"wss://fstream.binance.com/market/stream?streams=")
            +P.sy.toLowerCase()+"@aggTrade";
  const catchUp=async()=>{
    for(let i=0;i<10&&g===gen;i++){
      const r=await fetch(`${rest}?symbol=${P.sy}&limit=1000&fromId=${lastId+1}`);
      if(!r.ok)return;const d=await r.json();if(!d.length)return;
      for(const x of d){addTrade(x.T,+x.p,+x.q,x.m);lastId=x.a}
      if(d.length<1000)return;
    }
  };
  const open=()=>{
    let last=Date.now();
    ws=new WebSocket(url);
    const wd=setInterval(()=>{if(g!==gen)clearInterval(wd);else if(Date.now()-last>45000)ws.close()},10000);
    ws.onopen=()=>{$("st").textContent=`live: ${P.sy} ${P.mk}`;catchUp().catch(()=>{})};
    ws.onmessage=e=>{
      last=Date.now();
      const m=JSON.parse(e.data),d=m.data||m;
      if(d.a>lastId){lastId=d.a;addTrade(d.T,+d.p,+d.q,d.m)}
    };
    ws.onerror=()=>{$("st").textContent="websocket error…"};
    ws.onclose=()=>{clearInterval(wd);if(g===gen){$("st").textContent="reconnecting…";setTimeout(open,2000)}};
  };open();draw();
}

function draw(){
  dirty=false;
  const keys=[...bars.keys()].sort((a,b)=>a-b).slice(-P.nb);if(!keys.length)return;
  let lo=1e18,hi=-1e18;
  for(const k of keys)for(const r of bars.get(k).lv.keys()){lo=Math.min(lo,r);hi=Math.max(hi,r)}
  const rows=hi-lo+1,W=PAD+keys.length*BW+20,H=rows*CH+FOOT+40;
  const cv=$("cv"),dpr=devicePixelRatio||1;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";
  const c=cv.getContext("2d");c.scale(dpr,dpr);c.fillStyle="#10141a";c.fillRect(0,0,W,H);
  c.font="11px ui-monospace,Menlo,Consolas,monospace";c.textBaseline="middle";
  const y=r=>20+(hi-r)*CH;
  c.textAlign="right";c.fillStyle="#6b7686";
  for(let r=lo;r<=hi;r+=Math.max(1,Math.ceil(2/ (CH/16))))c.fillText((r*P.rs).toFixed(2),PAD-6,y(r)+CH/2);
  keys.forEach((k,i)=>{
    const b=bars.get(k),x=PAD+i*BW,w=BW-6;
    const bid=r=>(b.lv.get(r)||[0,0])[0],ask=r=>(b.lv.get(r)||[0,0])[1];
    let tb=0,ta=0,poc=null,pv=0;
    const buyI=new Set(),selI=new Set();
    for(const [r,[bd,ak]] of b.lv){
      tb+=bd;ta+=ak;if(bd+ak>pv){pv=bd+ak;poc=r}
      if(ak>=P.mv&&ak>=P.ir*bid(r-1)&&b.lv.has(r-1))buyI.add(r);
      if(bd>=P.mv&&bd>=P.ir*ask(r+1)&&b.lv.has(r+1))selI.add(r);
    }
    c.textAlign="center";c.fillStyle="#8a95a5";
    c.fillText(new Date(k*1000).toTimeString().slice(0,5),x+w/2,10);
    for(const [r,[bd,ak]] of b.lv){
      const yy=y(r),dom=ak>=bd,ratio=dom?ak/(bd||.0001):bd/(ak||.0001);
      c.fillStyle=mix(NEU,dom?BUY:SEL,(ratio-1)/Math.max(.1,P.ir-1)*.9);
      c.fillRect(x,yy,w,CH-1);
      c.fillStyle=(buyI.has(r)||selI.has(r))?"#fff":"#c9d1dc";
      c.font=(buyI.has(r)||selI.has(r)?"bold ":"")+"11px ui-monospace,Menlo,Consolas,monospace";
      c.fillText(`${fmt(bd)} x ${fmt(ak)}`,x+w/2,yy+CH/2);
      if(buyI.has(r)){c.fillStyle="#38bdf8";c.fillRect(x+w-4,yy,4,CH-1)}
      if(selI.has(r)){c.fillStyle="#fb923c";c.fillRect(x,yy,4,CH-1)}
      if(r===poc){c.strokeStyle="#facc15";c.lineWidth=2;c.strokeRect(x+1,yy+1,w-2,CH-3)}
    }
    // stacked imbalances
    for(const [set,col,sx] of [[buyI,"#3b82f6",x+w+1],[selI,"#d946ef",x-4]]){
      let run=0;
      for(let r=lo;r<=hi+1;r++){
        if(set.has(r)){run++;continue}
        if(run>=P.sc){c.fillStyle=col;c.fillRect(sx,y(r-1),3,run*CH-1)}
        run=0;
      }
    }
    const d=ta-tb,fy=20+rows*CH+14;
    c.font="bold 11px ui-monospace,Menlo,Consolas,monospace";
    c.fillStyle=d>=0?"#4ade80":"#f87171";c.fillText((d>=0?"+":"")+fmt(d),x+w/2,fy);
    c.fillStyle="#8a95a5";c.font="11px ui-monospace,Menlo,Consolas,monospace";c.fillText(fmt(ta+tb),x+w/2,fy+16);
  });
  c.textAlign="right";c.fillStyle="#6b7686";
  c.fillText("Delta",PAD-6,20+rows*CH+14);c.fillText("Vol",PAD-6,20+rows*CH+30);
}
function fmt(v){return v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2)}

$("sy").onchange=()=>{
  const v=$("sy").value;$("cl").style.display=v==="custom"?"":"none";
  if(v!=="custom"){const[,m,r]=v.split("|");$("mk").value=m;$("rs").value=r;load()}
};
$("go").onclick=load;
(function loop(){if(dirty)draw();setTimeout(loop,250)})();
$("sy").onchange();
</script>
</body>
</html>
