name: Fetch Dukascopy data for MT4

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: "Dukascopy instrument, lowercase (xauusd, eurusd, gbpusd, usdjpy, xagusd...)"
        default: "xauusd"
      timeframe:
        description: "Candle size"
        type: choice
        default: "m5"
        options: ["m1", "m5", "m15", "m30", "h1", "h4"]
      from_date:
        description: "Start date (YYYY-MM-DD)"
        default: "2024-01-01"
      to_date:
        description: "End date (YYYY-MM-DD)"
        default: "2026-10-01"
      dst_tz:
        description: "Your broker's server timezone"
        default: "Europe/Athens"
      digits:
        description: "Price digits (XAUUSD usually 2, EURUSD 5, USDJPY 3)"
        default: "2"
      spread:
        description: "Fixed spread in points for the .hst file"
        default: "25"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download from Dukascopy (monthly chunks, with retries)
        run: |
          START="${{ inputs.from_date }}"
          END="${{ inputs.to_date }}"
          INSTRUMENT="${{ inputs.instrument }}"
          TF="${{ inputs.timeframe }}"
          mkdir -p download
          FAILED=""
          CUR="$START"
          while [[ "$CUR" < "$END" ]]; do
            NEXT=$(date -d "$CUR +1 month" +%F)
            if [[ "$NEXT" > "$END" ]]; then NEXT="$END"; fi
            OK=0
            for ATTEMPT in 1 2 3 4 5 6; do
              echo "== $CUR -> $NEXT (attempt $ATTEMPT)"
              if npx --yes dukascopy-node -i "$INSTRUMENT" -from "$CUR" -to "$NEXT" \
                   -t "$TF" -f csv -v true -r 8 -rp 5000 -bs 2 -bp 3000; then
                OK=1; break
              fi
              sleep $((ATTEMPT * 45))   # back off when rate limited (HTTP 429)
            done
            if [[ $OK -eq 0 ]]; then FAILED="$FAILED $CUR"; fi
            sleep 5
            CUR="$NEXT"
          done
          ls -la download
          if [[ -n "$FAILED" ]]; then
            echo "::warning::These chunks failed and are MISSING from the data:$FAILED"
          fi

      - name: Convert to MT4 format
        run: |
          TF="${{ inputs.timeframe }}"
          case "$TF" in
            m1) P=1;; m5) P=5;; m15) P=15;; m30) P=30;; h1) P=60;; h4) P=240;;
          esac
          python3 dukascopy_to_mt4.py \
            --symbol "$(echo '${{ inputs.instrument }}' | tr '[:lower:]' '[:upper:]')" \
            --period "$P" \
            --dst-tz "${{ inputs.dst_tz }}" \
            --digits "${{ inputs.digits }}" \
            --spread "${{ inputs.spread }}" \
            --hst

      - uses: actions/upload-artifact@v4
        with:
          name: mt4-${{ inputs.instrument }}-${{ inputs.timeframe }}
          path: |
            *.csv
            *.hst
