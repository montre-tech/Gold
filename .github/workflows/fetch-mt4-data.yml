name: Fetch MT4 history data

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Forex symbol (e.g. EURUSD, GBPUSD, USDJPY)"
        default: "EURUSD"
      interval:
        description: "Candle size"
        type: choice
        default: "5min"
        options: ["1min", "5min", "15min", "30min", "1hour", "4hour"]
      from_date:
        description: "Start date (YYYY-MM-DD)"
        default: "2025-01-01"
      to_date:
        description: "End date (YYYY-MM-DD)"
        default: "2026-10-01"
      src_tz:
        description: "Timezone of FMP timestamps"
        default: "America/New_York"
      dst_tz:
        description: "Your broker's server timezone"
        default: "Europe/Athens"
      spread:
        description: "Fixed spread in points for the .hst file"
        default: "12"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Download and convert
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python fmp_to_mt4.py \
            --apikey "$FMP_API_KEY" \
            --symbol "${{ inputs.symbol }}" \
            --interval "${{ inputs.interval }}" \
            --from "${{ inputs.from_date }}" \
            --to "${{ inputs.to_date }}" \
            --src-tz "${{ inputs.src_tz }}" \
            --dst-tz "${{ inputs.dst_tz }}" \
            --spread "${{ inputs.spread }}" \
            --hst

      - uses: actions/upload-artifact@v4
        with:
          name: mt4-${{ inputs.symbol }}-${{ inputs.interval }}
          path: |
            *.csv
            *.hst
